name: Daily SEO & Traffic Report

# SUPERSEDED, and the schedule is off deliberately.
#
# This has failed on every scheduled run. scripts/daily_report.py line 18 reads
#     SMTP_PORT = int(os.environ.get("SMTP_PORT", "465"))
# and the workflow passes SMTP_PORT as an EMPTY STRING, so the default never
# applies — os.environ.get returns '' for a key that exists — and int('') raises.
# SMTP_USER, SMTP_PASS and SMTP_HOST are empty too, so even past the crash it has
# no way to send.
#
# It is also a duplicate. khatib-report.service on the kwnas homelab produces the
# same report at 05:11 UTC and emails it through Resend, successfully, every day
# — the 2026-09-18 run logged "[email] OK" and the report reached the inbox.
#
# So the only thing this workflow has produced for some time is a daily failure
# notification and a red mark on the repo. The schedule is removed rather than the
# file: workflow_dispatch stays, so it can still be run by hand, and restoring it
# is uncommenting one line once the SMTP secrets exist.
on:
  # schedule:
  #   - cron: '0 5 * * *'    # 05:00 UTC = 08:00 Kuwait — retired 2026-09-18, see above
  workflow_dispatch: {}        # allows manual "Run workflow" from the Actions tab

permissions:
  contents: read

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (recent history for the "shipped in 24h" section)
        uses: actions/checkout@v4
        with:
          fetch-depth: 60

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet google-analytics-data google-api-python-client fpdf2

      - name: Write GA4 key from secret
        run: printf '%s' "$GA4_KEY" > "$RUNNER_TEMP/ga4-key.json"
        env:
          GA4_KEY: ${{ secrets.GA4_KEY }}

      - name: Run executive report (GA4 + Search Console + PDF + email)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/ga4-key.json
          GA4_PROPERTY: '540327946'
          GSC_SITE: 'sc-domain:khatibdesigns.com'
          REPORT_EMAIL: 'nader@khatibdesigns.com'
          PDF_OUT: ${{ runner.temp }}/khatib-report.pdf
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python3 scripts/daily_report.py
